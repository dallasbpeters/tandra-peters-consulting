<svg id="noice" width="100%" height="100%">
    <filter id="noise-filter">
        <feTurbulence type="fractalNoise" baseFrequency="1.34" numOctaves="4" stitchTiles="stitch"></feTurbulence>
        <feColorMatrix type="saturate" values="0"></feColorMatrix>
        <feComponentTransfer>
            <feFuncR type="linear" slope="0.52"></feFuncR>
            <feFuncG type="linear" slope="0.52"></feFuncG>
            <feFuncB type="linear" slope="0.52"></feFuncB>
            <feFuncA type="linear" slope="0.34"></feFuncA>
        </feComponentTransfer>
        <feComponentTransfer>
            <feFuncR type="linear" slope="1.8" intercept="-0.40"/>
            <feFuncG type="linear" slope="1.8" intercept="-0.40"/>
            <feFuncB type="linear" slope="1.8" intercept="-0.40"/>
        </feComponentTransfer>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise-filter)"></rect>
</svg>
