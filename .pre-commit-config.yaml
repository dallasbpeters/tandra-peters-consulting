default_stages: [pre-commit]
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ultracite
        name: ultracite
        entry: pnpm dlx ultracite fix
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        entry: pnpm exec stylelint
        language: system
        files: \.(css)$
        pass_filenames: true
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --no-warn-ignored
        language: system
        files: \.(js|jsx|ts|tsx)$
        exclude: ^(\.agents|\.claude|studio-tandra-peters)/
        pass_filenames: true
      # Auto-fixes like trailing-whitespace: a failed run leaves files
      # formatted — just `git add` and commit again.
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
